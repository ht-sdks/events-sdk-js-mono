name: Deploy to NPM

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ${{ github.event.release.tag_name || github.ref_name }}
    secrets:
      NPM_TOKEN:
        required: true
    outputs:
      version:
        description: "The NPM package version"
        value: ${{ jobs.deploy.outputs.version }}

jobs:
  deploy:
    if: ${{ startsWith(inputs.tag, inputs.name) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: https://registry.npmjs.org
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Parse version
        id: parse_version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "VERSION=${TAG##${{ inputs.name }}@}" >> $GITHUB_OUTPUT

      - name: Set version
        working-directory: ${{ inputs.working-directory}}
        run: npm version ${{ steps.parse_version.outputs.VERSION }} --allow-same-version --no-commit-hooks --no-git-tag-version

      - name: Build
        working-directory: ${{ inputs.working-directory}}
        run: npx turbo run build

      - name: Publish
        working-directory: ${{ inputs.working-directory}}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0
        run: npm publish --access=public
